<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конспекты лекций</title>
<script data-goatcounter="https://vmaiorov.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root{
    --bg:#f7f5f1; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eef4ff; --line:#e5e7eb;
  }
  html[data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#60a5fa; --accent-soft:#1e293b; --line:#334155;
  }
  html[data-theme="dark"] body{color-scheme:dark}
  html[data-theme="dark"] header.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; line-height:1.65; font-size:16px}
  .wrap{max-width:960px; margin:0 auto; padding:32px 20px 90px}
  header.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; border-radius:16px; padding:36px 32px; margin-bottom:28px}
  header.hero h1{margin:0 0 10px; font-size:1.6rem; line-height:1.25}
  header.hero .sub{opacity:.92; font-size:.97rem}
  header.hero .meta{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:rgba(255,255,255,.16); padding:4px 12px; border-radius:999px; font-size:.82rem}
  .theme-toggle{position:fixed; right:18px; top:18px; z-index:50; width:44px; height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:1.15rem; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.12); transition:transform .15s, border-color .15s}
  .theme-toggle:hover{border-color:var(--accent); transform:scale(1.06)}
  h2{font-size:1.35rem; margin:2.2em 0 .6em; padding-bottom:.35em; border-bottom:2px solid var(--line)}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 20px; margin:14px 0; transition:border-color .15s, box-shadow .15s}
  .card:hover{border-color:#c7dbff; box-shadow:0 2px 12px rgba(37,99,235,.06)}
  .parallel{display:flex; align-items:center; gap:16px; cursor:pointer; user-select:none; padding:12px 0}
  .parallel .badge{width:52px; height:52px; flex:0 0 52px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:700}
  .parallel .info{flex:1}
  .parallel .info .name{font-weight:700; font-size:1.12rem}
  .parallel .info .meta{color:var(--muted); font-size:.9rem; margin-top:2px}
  .parallel .chev{color:var(--muted); transition:transform .18s; font-size:1rem}
  .parallel.open .chev{transform:rotate(90deg)}
  .lessons{display:none; margin:0 0 12px; padding-top:6px; border-top:1px dashed var(--line)}
  .parallel.open + .lessons{display:block}
  .lesson{display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line); border-radius:10px; margin:9px 0; transition:background .15s, border-color .15s; color:var(--ink)}
  .lesson:hover{background:var(--accent-soft); border-color:#c7dbff; text-decoration:none}
  .lesson .check{flex:0 0 auto; width:20px; height:20px; margin:0; accent-color:var(--accent); cursor:pointer}
  .lesson .num{font-weight:700; color:var(--accent); min-width:78px; font-size:.9rem}
  .lesson .title{flex:1}
  .lesson .go{color:var(--muted); font-size:.85rem; white-space:nowrap}
  .lesson.done .title{text-decoration:line-through; opacity:.6}
  .progress{margin:4px 0 0; font-size:.88rem; color:var(--muted)}
  .progress .bar{height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px}
  .progress .bar span{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
  .empty{color:var(--muted); font-size:.92rem; padding:8px 2px}
  .actions{display:flex; flex-wrap:wrap; gap:10px; margin:26px 0 0}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:10px; font-size:.92rem; font-weight:600; transition:background .15s, border-color .15s, transform .1s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{background:#1d4ed8; text-decoration:none}
  .btn-ghost{background:var(--card); color:var(--accent); border:1px solid var(--line)}
  .btn-ghost:hover{border-color:#c7dbff; background:var(--accent-soft); text-decoration:none}
  footer{margin-top:50px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.85rem}
  @media(max-width:680px){header.hero{padding:26px 20px} .wrap{padding:16px 12px 60px} .lesson .go{display:none}}
  @media print{.chev{display:none} .lessons{display:block !important} .card{box-shadow:none} body{background:#fff} header.hero{-webkit-print-color-adjust:exact; print-color-adjust:exact}}
</style>
</head>
<body>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Переключить тему" title="Светлая / тёмная тема">🌙</button>
<div class="wrap">

<header class="hero">
  <h1>Конспекты лекций</h1>
  <div class="sub">Выберите параллель, затем лекцию — конспект откроется в новой вкладке.</div>
  <div class="meta">
    <span class="chip">5 параллелей</span>
    <span class="chip" id="lchip">0 лекций</span>
    <span class="chip">Офлайн HTML</span>
  </div>
</header>

<h2>Параллели</h2>
<div class="progress">
  <span id="progress-label">Прочитано 0 из 0</span>
  <div class="bar"><span id="progress-bar"></span></div>
</div>
<div id="tree"></div>

<div class="actions">
  <a class="btn btn-primary" href="https://github.com/vmaiorov-collab/conspectus/issues/new?template=feedback.yml" target="_blank" rel="noopener">Оставить отзыв ↗</a>
  <a class="btn btn-ghost" href="https://github.com/vmaiorov-collab/conspectus/discussions" target="_blank" rel="noopener">Обсуждения ↗</a>
</div>

<footer>
  Всего параллелей: <span id="pcount">0</span> · Всего лекций: <span id="lcount">0</span>
</footer>

</div>

<script>
const DATA = [
  { key: "a",  name: "Параллель A",  badge: "A",  url: "https://www.youtube.com/playlist?list=PLPEbYG2GETx8", lessons: [
    { n: "Занятие 2", title: "Оптимизации DP", href: "parallel-a/parallel-a-zan2-optimizacii-dp.html" }
  ]},
  { key: "ap", name: "Параллель A'", badge: "A'", url: "https://www.youtube.com/playlist?list=PLVEPlEFLCYes", lessons: [
    { n: "Занятие 1", title: "Корневые эвристики", href: "parallel-ap/parallel-ap-zan1-kornevye.html" },
    { n: "Занятие 2", title: "Структуры данных 1", href: "parallel-ap/parallel-ap-zan2-struktury.html" }
  ]},
  { key: "b",  name: "Параллель B",  badge: "B",  url: "https://www.youtube.com/playlist?list=PLfU-HktHP470", lessons: [
    { n: "Занятие 2", title: "Строки 1", href: "parallel-b/parallel-b-zan2-stroki.html" }
  ]},
  { key: "bp", name: "Параллель B'", badge: "B'", url: "https://www.youtube.com/playlist?list=PLP5aGLvQB07Y", lessons: [
    { n: "Занятие 1", title: "C++", href: "parallel-bp/parallel-bp-zan1-cpp.html" },
    { n: "Занятие 2", title: "Поиски", href: "parallel-bp/parallel-bp-zan2-poiski.html" }
  ]},
  { key: "c",  name: "Параллель C",  badge: "C",  url: "https://www.youtube.com/playlist?list=PLNeWOJRrsoEA", lessons: [
    { n: "Занятие 1", title: "Вводная лекция", href: "parallel-c/parallel-c-zan1-vvodnaya.html" },
    { n: "Занятие 2", title: "Оценка сложности и сортировки", href: "parallel-c/parallel-c-zan2-slozhnost-sortirovki.html" }
  ]}
];

const tree = document.getElementById("tree");
let totalLessons = 0;

function plural(n){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return "конспект";
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return "конспекта";
  return "конспектов";
}

DATA.forEach((p) => {
  const card = document.createElement("div");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "parallel";
  head.innerHTML = `
    <div class="badge">${p.badge}</div>
    <div class="info">
      <div class="name">${p.name}</div>
      <div class="meta">${p.lessons.length} ${plural(p.lessons.length)} · <a href="${p.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">плейлист ↗</a></div>
    </div>
    <div class="chev">▶</div>`;

  const list = document.createElement("div");
  list.className = "lessons";

  p.lessons.forEach((l) => {
    totalLessons++;
    const a = document.createElement("a");
    a.className = "lesson";
    a.href = l.href;
    a.target = "_blank";
    a.rel = "noopener";
    a.dataset.key = l.href;
    a.innerHTML = `<input type="checkbox" class="check" aria-label="Отметить прочитанным"><span class="num">${l.n}</span><span class="title">${l.title}</span><span class="go">открыть ↗</span>`;
    const box = a.querySelector(".check");
    box.checked = isDone(l.href);
    if (box.checked) a.classList.add("done");
    box.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      box.checked = !box.checked;
      setDone(l.href, box.checked);
      a.classList.toggle("done", box.checked);
      updateProgress();
    });
    list.appendChild(a);
  });

  head.addEventListener("click", () => head.classList.toggle("open"));

  card.appendChild(head);
  card.appendChild(list);
  tree.appendChild(card);
});

document.getElementById("pcount").textContent = DATA.length;
document.getElementById("lcount").textContent = totalLessons;
document.getElementById("lchip").textContent = totalLessons + " лекций";

const DONE_KEY = "conspectusDone";
function getDone(){
  try { return JSON.parse(localStorage.getItem(DONE_KEY) || "{}") || {}; } catch(e){ return {}; }
}
function isDone(href){ return !!getDone()[href]; }
function setDone(href, val){
  const d = getDone();
  if (val) d[href] = 1; else delete d[href];
  try { localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch(e){}
}
function updateProgress(){
  const done = Object.keys(getDone()).length;
  const label = document.getElementById("progress-label");
  const bar = document.getElementById("progress-bar");
  if (label) label.textContent = "Прочитано " + done + " из " + totalLessons;
  if (bar) bar.style.width = totalLessons ? Math.round(done / totalLessons * 100) + "%" : "0%";
}
updateProgress();

(function(){
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const saved = (function(){ try { return localStorage.getItem("conspectusTheme"); } catch(e){ return null; } })();
  const initial = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function apply(theme){
    root.setAttribute("data-theme", theme);
    btn.textContent = theme === "dark" ? "☀️" : "🌙";
  }
  apply(initial);
  btn.addEventListener("click", function(){
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem("conspectusTheme", next); } catch(e){}
  });
})();
</script>
</body>
</html>
