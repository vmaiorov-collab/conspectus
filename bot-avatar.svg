<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>

  <!-- облачко сообщения -->
  <g filter="url(#shadow)">
    <path fill="#ffffff" d="
      M 190 170
      H 450
      A 60 60 0 0 1 510 230
      V 380
      A 60 60 0 0 1 450 440
      H 285
      L 210 500
      L 222 440
      H 190
      A 60 60 0 0 1 130 380
      V 230
      A 60 60 0 0 1 190 170 Z"/>
  </g>

  <!-- </> -->
  <g fill="none" stroke="url(#ink)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="255,240 205,305 255,370"/>
    <line x1="342" y1="232" x2="298" y2="378"/>
    <polyline points="385,240 435,305 385,370"/>
  </g>
</svg>
