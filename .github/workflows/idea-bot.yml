name: idea-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll Telegram and forward ideas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.IDEA_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.IDEA_BOT_OWNER_CHAT_ID }}
        run: python3 scripts/idea-bot.py
